version: '3.8'

services:
  mongo-db:
    image: mongo:latest
    container_name: chat_mongodb
    ports:
      - "27017:27017" 
    volumes:
      - mongo_data:/data/db 
    networks:
      - chat-net

  auth-service:
    build: ./auth
    container_name: auth_service
    ports:
      - "8000:8000"
    volumes:
      - ./users.db:/app/users.db
    networks:
      - chat-net

  chat-service:
    build: ./chat
    container_name: chat_service
    ports:
      - "8001:8001"
    depends_on:
      - auth-service
    networks:
      - chat-net
    environment:
      - MONGO_URL=mongodb://mongo-db:27017/chat_database

  frontend:
    build: ./frontend
    container_name: chat_frontend
    ports:
      - "8080:80"
    depends_on:
      - auth-service
      - chat-service
    networks:
      - chat-net

  tester:
    image: python:3.9-slim
    container_name: test_runner
    working_dir: /project
    volumes:
      - .:/project 
    command: tail -f /dev/null
    environment:
      - AUTH_URL=http://auth-service:8000
      - CHAT_URL=ws://chat-service:8001
      - MONGO_URL=mongodb://mongo-db:27017/chat_database
    depends_on:
      - auth-service
      - chat-service
    networks:
      - chat-net

volumes:
  mongo_data:

networks:
  chat-net:
    driver: bridge