<!DOCTYPE html>
<html>
<head>
    <title>Distributed Chat Test</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 20px auto; }
        .box { border: 1px solid #ccc; padding: 15px; margin-bottom: 20px; border-radius: 5px; }
        #chat-log { height: 300px; overflow-y: scroll; border: 1px solid #ddd; padding: 10px; background: #f9f9f9; }
        .msg { margin: 5px 0; padding: 5px; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>
    <h2>Chat System (Distributed)</h2>
    
    <div class="box" id="auth-box">
        <h3>1. Login/Register (Auth Service :8000)</h3>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button onclick="register()">Register</button>
        <button onclick="login()">Login</button>
        <p id="auth-status"></p>
    </div>

    <div class="box" id="chat-box" style="display:none;">
        <h3>2. Chat (Chat Service :8001)</h3>
        <p>Logged in as: <span id="current-user"></span></p>
        <input type="text" id="recipient" placeholder="Send to (username)">
        <div id="chat-log"></div>
        <input type="text" id="message" placeholder="Type message...">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        let token = "";
        let ws = null;
        let myUser = "";

        async function register() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            const res = await fetch('http://localhost:8000/register', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: u, password: p})
            });
            document.getElementById('auth-status').innerText = res.status === 201 ? "Registered!" : "Error";
        }

        async function login() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            const res = await fetch('http://localhost:8000/login', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: u, password: p})
            });
            const data = await res.json();
            if (data.access_token) {
                token = data.access_token;
                myUser = u;
                document.getElementById('auth-box').style.display = 'none';
                document.getElementById('chat-box').style.display = 'block';
                document.getElementById('current-user').innerText = u;
                connectWS();
            }
        }

        function connectWS() {
            ws = new WebSocket(`ws://localhost:8001/ws?token=${token}`);
            
            ws.onmessage = function(event) {
                const data = JSON.parse(event.data);
                const log = document.getElementById('chat-log');
                const div = document.createElement('div');
                div.className = 'msg';
                div.innerHTML = `<b>${data.from}:</b> ${data.msg}`;
                log.appendChild(div);
                log.scrollTop = log.scrollHeight;
            };
        }

        function sendMessage() {
            const recipient = document.getElementById('recipient').value;
            const msg = document.getElementById('message').value;
            if (ws && recipient && msg) {
                ws.send(JSON.stringify({to: recipient, msg: msg}));
                document.getElementById('message').value = '';
            }
        }
    </script>
</body>
</html>
