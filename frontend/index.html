<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distributed Chat System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="auth-box">
        <h3>Distributed Chat</h3>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Login / Register</button>
        <p id="auth-status" style="font-size: 12px; color: #666;"></p>
    </div>

    <div class="app-container" id="chat-box" style="display:none;">
        
        <div class="sidebar">
            <div class="sidebar-header">
                My User: <span id="current-user" style="color: #0084ff;"></span>
            </div>
            <div class="contact-list" id="contact-list">
                </div>
            <div style="padding:10px; text-align:center;">
                <button onclick="loadContacts()" style="font-size:12px; padding:5px;">↻ Refresh List</button>
            </div>
        </div>

        <div class="chat-area">
            <div class="chat-header">
                <div>
                    Chat with: 
                    <input type="text" id="recipient" placeholder="New user..." onchange="loadHistory()">
                </div>
            </div>

            <div id="chat-log">
                <div style="text-align:center; color:#777; margin-top:50px;">Select a contact or type a name to start</div>
            </div>

            <div class="message-input">
                <input type="text" id="message" placeholder="Type a message..." onkeypress="handleEnter(event)">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
